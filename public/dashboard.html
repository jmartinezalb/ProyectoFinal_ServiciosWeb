<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Finanzas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-4">Dashboard de Finanzas Personales</h2>
    
    <!-- Mensajes -->
    <div id="message" class="mb-3"></div>

    <!-- Botones para agregar -->
    <div class="mb-4">
      <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addExpenseModal">Agregar Gasto</button>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">Agregar Categoría</button>
    </div>
    <div class="mb-4">
        <h4>Balance: <span id="balance">$0.00</span></h4>
      </div>
    <!-- Gastos -->
    <h4>Gastos</h4>
    <table class="table table-striped mb-4" id="expensesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Categorías -->
    <h4>Categorías</h4>
    <ul class="list-group" id="categoriesList"></ul>
  </div>

  <!-- Modal Agregar Gasto -->
  <div class="modal fade" id="addExpenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Gasto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="expenseForm">
            <div class="mb-3">
              <input type="number" step="0.01" class="form-control" id="expenseAmount" placeholder="Monto" required>
            </div>
            <div class="mb-3">
              <input type="date" class="form-control" id="expenseDate" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="expenseDesc" placeholder="Descripción" required>
            </div>
            <div class="mb-3">
              <select class="form-select" id="expenseCategory" required></select>
            </div>
            <button type="submit" class="btn btn-success w-100">Agregar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar Categoría -->
  <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Categoría</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="categoryForm">
            <div class="mb-3">
              <input type="text" class="form-control" id="categoryName" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="categoryDesc" placeholder="Descripción" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Agregar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
